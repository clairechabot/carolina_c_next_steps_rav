name: LinkedIn Scan (VM)

# Runs on the self-hosted VM runner (label: linkedin) - see VM-SETUP.md.
# Uses the authenticated LinkedIn session stored on the VM to get richer job
# results + "Meet the hiring team" contacts, banked into pending_jobs.json
# an hour before the Evening Edition. If no VM runner is online, this
# workflow queues until GitHub drops it (about 24 h) - the guest LinkedIn
# source in the main pipeline still covers LinkedIn, so nothing breaks.
#
# It gets its OWN concurrency group on purpose. It used to share the
# "digest" group with the morning scan and the Evening Edition; a queued
# job (no runner online) holds that group for its whole 24 h wait, so the
# edition went pending behind it and each newer pending run cancelled the
# older one - no edition ever ran. timeout-minutes only counts once a job
# has started, so it never rescued the queue. The commit step's
# pull --rebase already handles a push race with the digest workflows.

on:
  schedule:
    - cron: "0 14 * * *"    # 16:00 Zurich in summer, 15:00 in winter -
                            # always at least an hour before the edition
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-scan
  cancel-in-progress: false

jobs:
  linkedin:
    runs-on: [self-hosted, linkedin]
    timeout-minutes: 30
    env:
      TZ: Europe/Zurich
      # Ubuntu 24.04 marks the system Python "externally managed" and
      # rejects plain pip installs; this opt-out is the sanctioned escape
      # hatch for a single-purpose VM like this one.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install --quiet -r requirements.txt playwright

      - name: Authenticated LinkedIn scan + hiring-team extraction
        run: python3 linkedin_authenticated.py --max-detail 12

      - name: VM-only sources (CareerBeacon 403s GitHub's IPs)
        run: python3 vm_sources.py

      - name: Application tracker feed (the candidate's LinkedIn, read-only)
        env:
          SHEET_WEBHOOK_URL: ${{ vars.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN:       ${{ vars.SHEET_TOKEN }}
          SHEET_CSV_URL:     ${{ vars.SHEET_CSV_URL }}
        run: python3 linkedin_tracker.py

      - name: Commit pending pool
        run: |
          git config user.name "vern-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pending_jobs.json
          git diff --cached --quiet || git commit -m "LinkedIn scan $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
