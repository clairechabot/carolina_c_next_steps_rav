name: RAV Form

# Monthly proof-of-efforts export. Runs on the 2nd of each month and
# emails the PREVIOUS month's filled form (built from the tracker sheet),
# days before a typical RAV deadline - plus manual runs any time (e.g.
# after fixing a missing address in the sheet, or with a specific month).
#
# The 2nd, not the 1st: gives the tracker's daily Gmail scan a full extra
# day to catch confirmations from applications sent on the last day of
# the month.

on:
  schedule:
    - cron: "0 6 2 * *"    # 2nd of the month, 06:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "Month to export (YYYY-MM); empty = previous month"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Zurich
      SHEET_CSV_URL:      ${{ vars.SHEET_CSV_URL }}
      SHEET_LINK_URL:     ${{ vars.SHEET_LINK_URL }}
      RAV_MONTHLY_TARGET: ${{ vars.RAV_MONTHLY_TARGET }}
      RECIPIENT_NAME:     ${{ secrets.RECIPIENT_NAME }}
      SMTP_USER:          ${{ secrets.SMTP_USER }}
      SMTP_PASS:          ${{ secrets.SMTP_PASS }}
      EMAIL_TO:           ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Build and email the filled form
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python rav_export.py --month "${{ github.event.inputs.month }}"
          else
            python rav_export.py
          fi

      # The month's snapshot stays in the repo as an audit trail (the
      # sheet's RAV tabs are the primary trail; this is the belt).
      - name: Commit the exported form
        run: |
          git config user.name "vern-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rav_forms/
          git diff --cached --quiet || git commit -m "RAV form export $(date +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push
